name: Python tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests_python_38:

    runs-on: ubuntu-cloud-runner

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install websocket-client pylint
        curl -sSf https://install.surrealdb.com | sh
        surreal version
    - name: Lint
      run: |
        python -m pylint --rcfile pylint.toml src/surrealist
    - name: Unit-tests
      run: |
        python -m unittest discover -s tests/unit_tests
    - name: Integration tests with real DB
      run: |
        sh ./tests/up_db.sh &
        sleep 1
        python -m unittest discover -s tests/integration_tests
